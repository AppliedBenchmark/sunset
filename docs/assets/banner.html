<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- README banner (docs/assets/banner.png): the website's Sunset evening scene. A pale blush sky deepening
     to orange at the horizon, a half-set sun (gold to orange, with a coral ripple in a 4×4 Bayer dither,
     as Paper Shaders' `Dithering` draws it) and a still, deep blue sea with faint swell lines. The Applied
     Benchmark logo (appliedbenchmark.svg) and the text sit on the sky, clear of the sun.
     Render at 2x (2560×840), from the repository root:
       "<Chrome>" --headless --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,420 \
         --virtual-time-budget=8000 --screenshot=$PWD/docs/assets/banner.png file://$PWD/docs/assets/banner.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --sky-high: #efe3df;
    --sky-low: #f8d2c0;
    --peach: #ffb98f;
    --gold: #ffd696;
    --sun: #ff8a4c;
    --coral: #f05c4a;
    --ink: #1a1c21;
    --horizon: 112px;          /* sea height */
    --sun-size: 300px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 420px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(var(--sky-high), var(--sky-low) 40%, var(--peach) 78%, #ff9668);
    font-family: Geist, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  /* The sun, centred on the horizon; the sea covers its lower half. */
  .sun {
    position: absolute; left: 1000px; bottom: var(--horizon);
    width: var(--sun-size); aspect-ratio: 1; translate: -50% 50%;
    border-radius: 50%; overflow: hidden;
    background: linear-gradient(var(--gold), var(--sun) 70%);
    box-shadow: 0 0 100px 40px rgb(255 168 110 / 0.3);
  }
  .sun canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  .sea {
    position: absolute; inset-inline: 0; bottom: 0; height: var(--horizon); overflow: hidden;
    background: linear-gradient(#4f78ab, #2f5a8f 30%, #1c416f 70%, #14335a);
    box-shadow: inset 0 1px 0 rgb(20 40 70 / 0.5);
  }
  .sea span { position: absolute; inset-inline: 0; height: 2px; background: rgb(255 255 255 / 0.1); }
  .copy { position: absolute; left: 88px; top: 48px; width: 760px; }
  .org { display: block; height: 22px; width: auto; }
  h1 {
    margin-top: 30px; font-size: 92px; line-height: .95; font-weight: 600; letter-spacing: -0.045em;
  }
  p {
    margin-top: 18px; font-size: 25px; line-height: 1.32; font-weight: 400; letter-spacing: -0.012em;
    color: #2b2d33; white-space: nowrap;
  }
  .meta {
    margin-top: 20px; display: flex; gap: 8px;
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 14px; font-weight: 500;
  }
  .meta span {
    padding: 6px 11px; border-radius: 999px; color: var(--ink);
    background: rgb(255 255 255 / .55); box-shadow: inset 0 0 0 1px rgb(26 28 33 / .12);
  }
</style>
</head>
<body>
<div class="sun"><canvas id="c"></canvas></div>
<div class="sea" id="sea"></div>
<div class="copy">
  <img class="org" src="appliedbenchmark.svg" alt="Applied Benchmark">
  <h1>Sunset</h1>
  <p>Catch deprecated and retiring AI model IDs in your code.</p>
  <div class="meta"><span>GitHub Action</span><span>npx CLI</span><span>Open source</span></div>
</div>
<script>
  // Swell lines on the sea, as a fraction of its height: they spread apart as they come closer.
  for (const y of [0.06, 0.14, 0.25, 0.4, 0.6, 0.85]) {
    const s = document.createElement("span");
    s.style.top = `${y * 100}%`;
    document.getElementById("sea").append(s);
  }

  // The sun's ripple: Paper Shaders' `Dithering` (shape "ripple", type "4x4", size 3, scale 1.4) on the
  // CPU, held on the frame where the coral ring nears the rim (PHASE = 3t in the shader).
  // Coral dots where the ripple plus the Bayer threshold passes, clear elsewhere.
  const BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const DPR = 2, SIZE = 3 * DPR, SCALE = 1.4, PHASE = 1.5;
  const c = document.getElementById("c"), g = c.getContext("2d");
  const N = c.width = c.height = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sun-size")) * DPR;
  g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--coral").trim();
  for (let py = 0; py < N; py += SIZE) {
    for (let px = 0; px < N; px += SIZE) {
      // Cell coordinates around the centre, y up as in GL.
      const cx = Math.floor((px + 0.5 - N / 2) / SIZE), cy = Math.floor((N - py - 0.5 - N / 2) / SIZE);
      const u = ((cx + 0.5) * SIZE) / N / SCALE, v = ((cy + 0.5) * SIZE) / N / SCALE;
      const shape = Math.sin(Math.pow(Math.hypot(u, v), 1.7) * 7 - PHASE) * 0.5 + 0.5;
      const bx = ((cx % 4) + 4) % 4, by = ((cy % 4) + 4) % 4;
      if (shape + BAYER4[by * 4 + bx] / 16 - 0.5 >= 0.5) g.fillRect(px, py, SIZE, SIZE);
    }
  }
</script>
</body>
</html>
