# Where each provider publishes lifecycle data: only the providers' own pages, so every value in
# the registry can be traced to one. Validated against registry/schema.json#/$defs/SourcesFile.
#
# - `providers` maps each source provider (the platform owner) to its allowlist. Every `url`, and
#   every URL the snapshot tool fetches, must start with one of the prefixes.
# - Each source is snapshotted to registry/snapshots/<id>.txt by `npm run registry:snapshot`.
#   Registry entries name their source by `id` and use its `url` as `source_url`.
# - `fetch` is the machine-readable variant; `url` is the human page. `expect` is text the
#   normalized page must contain, which catches soft 404s and pages in another language.
# - `parser` names the updater's parser for the page; parsers are deterministic code, never a
#   language model.
#
# URLs verified on 2026-10-08.
schema_version: 1

providers:
  openai:
    allow:
      - https://developers.openai.com/api/docs/
      - https://platform.openai.com/docs/
  anthropic:
    allow:
      - https://platform.claude.com/docs/
      - https://docs.claude.com/
      - https://docs.anthropic.com/
  gemini-api:
    allow:
      - https://ai.google.dev/gemini-api/docs/
  vertex:
    allow:
      - https://docs.cloud.google.com/gemini-enterprise-agent-platform/
      # Imagen's model pages, which Agent Platform's docs don't have.
      - https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/imagen/
  bedrock:
    allow:
      - https://docs.aws.amazon.com/bedrock/
  azure-openai:
    allow:
      - https://learn.microsoft.com/en-us/azure/foundry/
      - https://raw.githubusercontent.com/MicrosoftDocs/azure-ai-docs/
  mistral:
    allow:
      - https://docs.mistral.ai/
      - https://raw.githubusercontent.com/mistralai/platform-docs-public/
  deepseek:
    allow:
      - https://api-docs.deepseek.com/

sources:
  - id: openai/deprecations
    provider: openai
    platforms: [openai]
    url: https://developers.openai.com/api/docs/deprecations
    fetch:
      kind: url
      url: https://developers.openai.com/api/docs/deprecations.md
      format: markdown
    expect: Shutdown date
    parser: openai-deprecations
    notes: >-
      One `YYYY-MM-DD: <title>` heading per announcement, each followed by a table whose first
      column is `Shutdown date`. Date formats are mixed.

  - id: anthropic/model-deprecations
    provider: anthropic
    platforms: [anthropic]
    url: https://platform.claude.com/docs/en/about-claude/model-deprecations
    fetch:
      kind: url
      url: https://platform.claude.com/docs/en/about-claude/model-deprecations.md
      format: markdown
    expect: Model status
    parser: anthropic-deprecations
    notes: >-
      The "Model status" table, plus per-announcement history tables. The dates apply to
      Anthropic-operated platforms only; Bedrock and Vertex set their own.

  - id: gemini-api/deprecations
    provider: gemini-api
    platforms: [gemini-api]
    url: https://ai.google.dev/gemini-api/docs/deprecations
    fetch:
      kind: url
      url: https://ai.google.dev/gemini-api/docs/deprecations.md.txt
      format: markdown
    expect: Shutdown date
    # The Markdown variant doesn't say which rows are shut down; the HTML page marks them gray.
    # Without `hl=en`, the HTML page redirects to a random language for Node's fetch.
    markup:
      url: https://ai.google.dev/gemini-api/docs/deprecations?hl=en
      row_classes: [row-gray]
    parser: gemini-api-deprecations
    page_qualifier:
      qualifier: no_earlier_than
      excerpt: 'The **shutdown dates listed in the table indicate the *earliest possible > dates* on which a model might be retired**.'

  - id: gemini-api/release-notes
    provider: gemini-api
    platforms: [gemini-api]
    url: https://ai.google.dev/gemini-api/docs/changelog
    fetch:
      kind: url
      url: https://ai.google.dev/gemini-api/docs/changelog.md.txt
      format: markdown
    expect: This page documents updates to the Gemini API.
    parser: gemini-api-release-notes
    notes: >-
      Adds the shut-down models the deprecations table no longer lists, such as Gemini 1.5: a
      dated note whose first bullet says they are shut down. Models the deprecations page lists
      stay its entries.

  - id: vertex/model-versions
    provider: vertex
    platforms: [vertex]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-versions
    fetch:
      kind: url
      url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/model-versions.md.txt
      format: markdown
    expect: Retirement date
    parser: vertex-model-versions
    notes: Google models. `<date> or later` is a no-earlier-than date.

  - id: vertex/partner-deprecations
    provider: vertex
    platforms: [vertex]
    url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/models/deprecations/partner-models
