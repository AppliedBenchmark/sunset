      format: markdown
    expect: Self-deploy alternative
    parser: vertex-open-model-deprecations
    notes: >-
      Deprecated open models served as MaaS. The IDs are written without the publisher that code
      puts in front of them (`meta/llama-3.3-70b-instruct-maas`).

