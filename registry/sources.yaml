  - id: azure-openai/model-retirement-schedule
    provider: azure-openai
    platforms: [azure-openai]
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-retirement-schedule
    fetch:
      kind: github-file
      repo: MicrosoftDocs/azure-ai-docs
      ref: main
      path: articles/foundry/openai/includes/concepts-model-retirement-schedule-content.md
    expect: Retirement date
    parser: azure-retirement-tables
    notes: >-
      The page's include file in the public docs repo (the `live` branch is stale). Every model
      maker's table is read. (name, version) isn't unique across the tables: a pair listed twice
      with different values is unverified.

  - id: azure-openai/retired-models
    provider: azure-openai
    platforms: [azure-openai]
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/retired-models
    fetch:
      kind: github-file
      repo: MicrosoftDocs/azure-ai-docs
      ref: main
      path: articles/foundry/openai/includes/concepts-retired-models-content.md
    expect: Suggested replacement
    parser: azure-retired-models
    notes: >-
      The page's include file, as for the retirement schedule. Only the Azure OpenAI table gives
      versions. The page only adds models: versions the schedule still lists stay its entries.

  - id: mistral/models
    provider: mistral
    platforms: [mistral]
    url: https://docs.mistral.ai/models
    fetch:
      kind: github-dir
      repo: mistralai/platform-docs-public
      ref: main
      path: src/schema/models/models
      include: .ts
      exclude: [index.ts]
    expect: apiNames
    parser: mistral-model-files
    notes: >-
      One TypeScript file per model with ISO `deprecationDate`, `retirementDate` and
      `replacement`. The files are read as text and never executed.

  - id: deepseek/updates
    provider: deepseek
    platforms: [deepseek]
    url: https://api-docs.deepseek.com/updates
    fetch:
      kind: url
      # `/updates` redirects here, and has answered 400 at times.
      url: https://api-docs.deepseek.com/updates/
      format: html
    expect: 'Date:'
    parser: deepseek-updates
    notes: >-
      A change log in free text, so the updater only lists model names it doesn't know for a
      human; it never changes DeepSeek entries. Unknown paths return the home page with a 200,
      hence `expect`.
