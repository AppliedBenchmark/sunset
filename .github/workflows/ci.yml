name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_VERSION: 1.30.1
  ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      # src/core/registry/types.gen.ts must match registry/schema.json.
      - run: npm run gen:types -- --check

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22.13.0 } # the oldest version `engines` allows
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  boundaries:
    name: Boundary self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # Lints deliberately violating files and fails unless every layer rule fires.
      - run: npm run test:boundaries

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      # Scans 100k synthetic lines with 1k, 5k and 20k registry IDs; fails at 10 s.
      # The results table goes to the job summary.
      - run: npm run bench

  check-dist:
    name: Check dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Compare the committed Action bundle with the rebuilt one
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git status --short -- dist/
            git diff --stat -- dist/
            exit 1
          fi
      - run: node dist/cli/index.js --version

  # The CLI as users get it: from the packed tarball, run the way npx runs it.
  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Pack the package and run it with npm exec
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball=$(ls "$RUNNER_TEMP"/appliedbenchmark-sunset-*.tgz)
          tar -tzf "$tarball" | sort
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          # The tarball, run the way `npx @appliedbenchmark/sunset` runs the published package.
          sunset() { npm exec --yes --package "$tarball" -- sunset "$@"; }
          sunset --version
          printf 'MODEL = "gpt-fixture-retired"\n' > app.py
          sunset scan --registry bundled --format json > report.json
          node -e 'const r = require("./report.json"); if (r.registry.origin !== "bundled") process.exit(1)'
          sunset registry info --registry bundled

  # The Action as users run it (`uses: ./`), against the fixture repos and against this repository.
  # On pull requests it also posts the PR comment, an end-to-end test of the PR delta; on pull
  # requests from forks the token is read-only and it posts a notice.
  action:
    name: Action self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write # the SARIF upload
    env:
      SUNSET_TODAY: '2099-01-01'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Run on a fixture repo
        id: fixture
        uses: ./ # zizmor: ignore[self-repository] actionlint 1.7.12 can't parse $/ yet
        with:
          path: test/fixtures/repos/python
          config: test/fixtures/self-test.sunset.yml
          registry: test/fixtures/registry/models.yaml
          fail-on: never
          json-file: ${{ runner.temp }}/python.json
          annotations: false
          summary: false
          pr-comment: false
      - name: Check the outputs and the report
        env:
          ERRORS: ${{ steps.fixture.outputs.errors }}
          WARNINGS: ${{ steps.fixture.outputs.warnings }}
          NOTICES: ${{ steps.fixture.outputs.notices }}
          ORIGIN: ${{ steps.fixture.outputs.registry-origin }}
        run: |
          echo "errors=$ERRORS warnings=$WARNINGS notices=$NOTICES origin=$ORIGIN"
          [ "$ERRORS/$WARNINGS/$NOTICES/$ORIGIN" = "3/4/3/file" ]
          node scripts/check-fixture-report.ts test/fixtures/repos/python "$RUNNER_TEMP/python.json"
      - name: Run the bundle on every fixture repo without special options
        run: |
          status=0
          for dir in test/fixtures/repos/*/; do
            [ -f "$dir/fixture.json" ] && continue
            name=$(basename "$dir")
            env "INPUT_PATH=$dir" INPUT_REGISTRY=test/fixtures/registry/models.yaml \
              INPUT_CONFIG=test/fixtures/self-test.sunset.yml "INPUT_FAIL-ON=never" \
              INPUT_ANNOTATIONS=false INPUT_SUMMARY=false "INPUT_PR-COMMENT=false" \
              "INPUT_JSON-FILE=$RUNNER_TEMP/$name.json" node dist/action/index.js > /dev/null || status=1
            node scripts/check-fixture-report.ts "$dir" "$RUNNER_TEMP/$name.json" || status=1
          done
          exit "$status"
      # The real registry and today's date. The SARIF goes to code scanning, which is free only for
      # public repositories, and not from forks, whose token is read-only.
      - name: Run on this repository
        id: self
        uses: ./ # zizmor: ignore[self-repository] actionlint 1.7.12 can't parse $/ yet
        env:
          SUNSET_TODAY: ''
        with:
          sarif-file: ${{ runner.temp }}/sunset.sarif
      - name: Show the outputs
        env:
          OUTPUTS: ${{ toJSON(steps.self.outputs) }}
        run: echo "$OUTPUTS"
      - name: Upload the SARIF to code scanning
        if: >-
          !cancelled() && steps.self.outputs.sarif-file != '' &&
          github.event.repository.private == false &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.self.outputs.sarif-file }}

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint and zizmor
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          curl -fsSLo zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tar.gz" | sha256sum -c -
          tar -xzf zizmor.tar.gz -C bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: actionlint -color
      # Our own files only: test/fixtures holds sample workflows that are scanned, never run.
      - run: zizmor --format=github .github action.yml
        env:
          GH_TOKEN: ${{ github.token }}

  # The single check the ruleset on main requires, so matrix changes don't need a ruleset change.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, boundaries, bench, check-dist, package, action, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
