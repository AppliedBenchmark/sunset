name: Release

# Publishes a version when its tag is pushed. The steps around it, including the human ones, are in
# docs/maintainers.md ("Releases").
# - `build`: the tag matches package.json and is on main; build, check dist/action, test, pack.
# - `publish`: stages the tarball on npm with trusted publishing (OIDC, no token) and provenance.
#   A maintainer approves the staged version with 2FA before it goes live.
# - `attest`: build provenance for the tarball and the Action bundle.
# - `release`: a draft GitHub release with the tarball and the attestation bundle. A maintainer
#   publishes it in the UI, where the Marketplace checkbox is; publishing makes it immutable.
# The major tag (v1) isn't moved here: a maintainer moves it by hand once the release is published,
# so `uses: AppliedBenchmark/sunset@v1` only ever resolves to a reviewed, published release.
# Pre-releases (vX.Y.Z-rc.N) are staged under the npm dist-tag `next`.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false # no cache in a release (cache poisoning)
      - name: Check the tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The tag $TAG doesn't match package.json's version $version."
            exit 1
          fi
          # The tagged commit must be on main: "identical" or "behind" means main contains it.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$TAG points to $GITHUB_SHA, which isn't on main (compare status: $status)."
            exit 1
          fi
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Compare the committed Action bundle with the rebuilt one
        run: |
          if [ -n "$(git status --porcelain -- dist/action)" ]; then
            echo "::error::dist/action is out of date for $TAG."
            git status --short -- dist/action
            exit 1
          fi
      - run: npm test
      - name: Pack
        run: |
          mkdir "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
          cp dist/action/index.js "$RUNNER_TEMP/release/action-index.js"
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    name: Stage on npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # trusted publishing and provenance
    env:
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Check npm
        run: |
          # Staged publishing needs npm 11.15.0 or later; trusted publishing needs 11.5.1.
          npm_version=$(npm --version)
          echo "npm $npm_version"
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && b < 15)) process.exit(1);
          ' "$npm_version" || { echo "::error::npm $npm_version is too old for npm stage publish."; exit 1; }
      - name: Stage the package
        run: |
          tarball=$(ls "$RUNNER_TEMP"/release/appliedbenchmark-sunset-*.tgz)
          # No --tag for a release: npm then applies `latest` itself, and refuses to when a higher
          # version is already published (a patch to an older minor), instead of moving it back.
          tag_args=()
          dist_tag=latest
          if [ "$PRERELEASE" = true ]; then
            tag_args=(--tag next)
            dist_tag=next
          fi
          npm stage publish "$tarball" --provenance --access public "${tag_args[@]}"
          {
            echo "### npm"
            echo
            echo "Staged \`@appliedbenchmark/sunset@${TAG#v}\` under \`$dist_tag\`. Approve it with 2FA:"
            echo "\`npm stage list @appliedbenchmark/sunset\`, then \`npm stage approve <stage-id>\`,"
            echo "or on npmjs.com under Staged Packages."
          } >> "$GITHUB_STEP_SUMMARY"

  attest:
    name: Attest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: ${{ runner.temp }}/release/*
      # The Sigstore bundle goes on the release too, so the files can be verified offline.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [build, publish, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attestation
          path: ${{ runner.temp }}/attestation
      - name: Create a draft release
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          bundle="$RUNNER_TEMP/appliedbenchmark-sunset-${TAG#v}.sigstore.json"
          cp "$(ls "$RUNNER_TEMP"/attestation/*)" "$bundle"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$TAG" --generate-notes "${flags[@]}" "$RUNNER_TEMP"/release/*.tgz "$bundle"
          {
            echo "### GitHub release"
            echo
            echo "Created a draft for $TAG. Review it, tick \"Publish this Action to the GitHub"
            echo "Marketplace\" and publish it. Publishing makes it immutable."
            if [ "$PRERELEASE" != true ]; then
              echo
              echo "Once it is published, move the major tag by hand (docs/maintainers.md, \"Releases\")."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
